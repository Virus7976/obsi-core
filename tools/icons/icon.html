<!doctype html>
<!--
  The Obsi app icon: the app's mark as one glass object. Its left half is cut like the Obsi crystal,
  its right half is smooth frosted glass. Open as icon.html?app=tube (tube, read, bible, learn).
  ?mode=fg draws the full-bleed adaptive-icon foreground (108 dp, launcher masks it),
  ?mode=tile draws a rounded preview. render.py turns these into the app resources.
-->
<html><head><meta charset="utf-8"><title>Obsi icon</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}svg{position:fixed;left:0;top:0;display:block}</style></head>
<body><div id="out"></div>
<script>
const q = new URLSearchParams(location.search);
const app = q.get('app') || 'tube', mode = q.get('mode') || 'fg', px = q.get('px') || 512;

// App marks, drawn in a -10..10 box. dx/dy nudge each to its optical centre.
const G = {
  tube:{d:'M-6,-8.5L9.5,0L-6,8.5Z', dx:-1.2, dy:0, cut:''},
  read:{d:'M-7.5,-9.5H7.5V9.5H-7.5Z', dx:0, dy:0, cut:'M-3.8,-4.5H3.8 M-3.8,0H3.8 M-3.8,4.5H1'},
  bible:{d:'M-8,-9.5H6Q8,-9.5 8,-7.5V9.5H-6Q-8,9.5 -8,7.5Z', dx:0, dy:0, cut:'M0,-6V5 M-3.8,-2.2H3.8'},
  learn:{d:'M0,-8.5L11.5,-2.8L0,3L-11.5,-2.8Z M-6.8,0.6V5.6Q0,10.4 6.8,5.6V0.6L0,4Z', dx:0, dy:-1, cut:'', tassel:true},
};
const g = G[app];
// Colour versions: the same glass turned round the colour wheel. Amethyst is the original.
const HUE = {amethyst:0, ruby:88, sapphire:-48, emerald:-112, amber:138};
const hue = HUE[q.get('tint') || 'amethyst'] || 0;
// The launcher shows about the middle 72 of the 108 units, so the mark is sized to that.
const s = mode === 'fg' ? 2.0 : 2.7, k = s / 2.7;
const cx = 54, cy = mode === 'fg' ? 54 : 52;
const m = `translate(${cx + g.dx * s},${cy + g.dy * s}) scale(${s})`;
const tasselShapes = t => g.tassel ? `<circle cx="9.5" cy="7.3" r="1.8" ${t}/><rect x="8.7" y="-1.8" width="1.6" height="8" ${t}/>` : '';
const shape = `<path d="${g.d}" stroke-linejoin="round" stroke-width="1.3"/>${g.tassel ? '<path d="M9.5,-1.8V6.2" stroke-width="1.6" stroke-linecap="round" fill="none"/><circle cx="9.5" cy="7.3" r="1.8"/>' : ''}`;
const fan = [[0,-36,-36,-14],[-36,-14,-36,18],[-36,18,0,40]].map(([a,b,c,d],i) =>
  `<path d="M${cx+a*k},${cy+b*k}L${cx+c*k},${cy+d*k}L${cx},${cy}Z" fill="url(#v${i})"/>`).join('');
const seams = `M${cx},${cy-36*k}L${cx},${cy+40*k} M${cx-36*k},${cy-14*k}L${cx},${cy} M${cx-36*k},${cy+18*k}L${cx},${cy}`;
const round = mode === 'tile';

document.getElementById('out').innerHTML = `<svg viewBox="0 0 108 108" width="${px}" height="${px}" xmlns="http://www.w3.org/2000/svg" style="${hue ? `filter:hue-rotate(${hue}deg) saturate(1.15)` : ''}"><defs>
  <clipPath id="t"><rect width="108" height="108" rx="${round ? 27 : 0}"/></clipPath>
  <radialGradient id="bg" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="#2a1560"/><stop offset=".7" stop-color="#1a0d3c"/><stop offset="1" stop-color="#160b33"/></radialGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".3" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="v0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#efe6ff"/><stop offset="1" stop-color="#a586ff"/></linearGradient>
  <linearGradient id="v1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9c6cff"/><stop offset="1" stop-color="#5a24d6"/></linearGradient>
  <linearGradient id="v2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c32e6"/><stop offset="1" stop-color="#260a68"/></linearGradient>
  <linearGradient id="c0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#d9c9ff" stop-opacity=".22"/></linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="${3.2 * k}"/></filter>
  <clipPath id="mk"><path d="${g.d}" transform="${m}" stroke-width="1.3" stroke-linejoin="round"/>${tasselShapes(`transform="${m}"`)}</clipPath>
</defs><g clip-path="url(#t)">
  <rect width="108" height="108" fill="url(#bg)"/>
  <g transform="${m}" fill="#6a3df0" stroke="#6a3df0" filter="url(#glow)" opacity=".7">${shape}</g>
  <g clip-path="url(#mk)">
    <rect x="${cx}" width="${108-cx}" height="108" fill="url(#c0)"/><rect x="${cx}" width="${108-cx}" height="108" fill="#a98bff" opacity=".35"/>
    <rect width="${cx}" height="108" fill="url(#v0)"/>
    ${fan}
    <path d="${seams}" stroke="#fff" stroke-opacity=".5" stroke-width="${.7*k}"/>
    <ellipse cx="${cx+6*k}" cy="${cy-18*k}" rx="${22*k}" ry="${12*k}" fill="#fff" opacity=".18"/>
  </g>
  <g transform="${m}" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width=".45">${shape.replace(/stroke-width="[^"]+"/g,'')}</g>
  ${g.cut ? `<path d="${g.cut}" transform="${m}" stroke="#2a0c6e" stroke-opacity=".85" stroke-width="1.6" stroke-linecap="round" fill="none"/>` : ''}
  ${round ? '<rect x=".5" y=".5" width="107" height="107" rx="26.5" fill="none" stroke="#fff" stroke-opacity=".08"/>' : ''}
</g></svg>`;
</script></body></html>
